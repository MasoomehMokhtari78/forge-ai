[alembic]
# Path to migration scripts directory, relative to this file.
script_location = alembic

# Add the backend/ directory to sys.path so that `from app...` imports work
# when Alembic runs from the backend/ directory.
prepend_sys_path = .

# Use os-specific path separator for version files.
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
